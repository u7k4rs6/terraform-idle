<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Terraform</title>
<meta name="description" content="A pixel-art idle game: heal dead alien worlds with lasers, mirrors, drones, comets and antimatter. Free, in the browser, keeps counting while you are away.">
<meta name="theme-color" content="#111622">
<meta property="og:title" content="Terraform">
<meta property="og:description" content="Revive 12 dead worlds. A pixel-art idle game with real space science.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://utkarshbahuguna.me/terraform-idle/">
<meta property="og:image" content="https://utkarshbahuguna.me/terraform-idle/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="style.css?v=9"><!-- ?v: bump on every release, so a new page never runs with a cached old stylesheet or script -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
<canvas id="c" tabindex="0" role="button" aria-label="Your planet. Tap it, or press Enter or Space, to collect life. When a golden comet or a supply crate is in the sky, Enter or Space catches it. M taps the moon. Open systems with the buttons at the bottom or keys 1 to 6."></canvas>
<header id="top">
  <div id="hud"><div id="life"></div><div id="rate"></div></div>
  <button id="goal"><span id="gtext"></span><span id="grew"></span></button>
  <button id="gear" aria-label="Settings" aria-controls="settings"></button>
</header>
<div id="toast" role="status" aria-live="polite"></div>
<div id="contract" role="status" hidden></div>
<!-- before the bar so the commander stands behind it -->
<div id="guide" hidden>
  <img id="gface" alt="Commander Vos">
  <div id="gbox"><button id="gbubble"><b id="gname">COMMANDER VOS</b><span id="gsay" aria-hidden="true"></span><small id="ghint"></small></button><button id="gskip">Skip</button></div>
  <p id="gsr" class="sr" aria-live="polite"></p>
</div>
<footer id="dock">
  <div id="world"><div id="winfo"><b id="wname"></b> <small id="wtime" aria-label="Run time"></small><small id="wtrait"></small></div><div id="heal" role="progressbar" aria-label="Terraformed" aria-valuemin="0" aria-valuemax="100"><div id="healbar"></div></div><div id="healtxt"></div></div>
  <nav id="bar" aria-label="Systems"></nav>
</footer>
<section id="panel" aria-labelledby="pname" hidden>
  <div id="phead"><button id="prev" class="arrow" aria-label="Previous system">&lt;</button><b id="pname"></b><button id="next" class="arrow" aria-label="Next system">&gt;</button><span id="pinfo"></span><button id="pclose" aria-label="Close">X</button></div>
  <div id="pbody"><div id="prows"></div><p id="pfact" class="fact"></p></div>
</section>
<section id="talents" role="dialog" aria-modal="true" aria-labelledby="tth" hidden>
  <header id="thead"><span id="tseeds"></span><h2 id="tth">Talents</h2><button id="tclose" aria-label="Close talents">X</button></header>
  <div id="tscroll"><button id="treset">Reset<small>refund all</small></button><div id="tree"></div></div>
  <div id="tinfo"><div class="rt"><span id="tname"></span><small id="tdesc"></small></div><button id="tbuy" class="buy"></button></div>
</section>
<section id="settings" role="dialog" aria-modal="true" aria-labelledby="sth" hidden>
  <div class="box">
    <header><h2 id="sth">Settings</h2><button id="sclose" aria-label="Close settings">X</button></header>
    <div id="sopts"></div>
    <h3>Achievements <span id="acount"></span></h3>
    <ul id="alist"></ul>
    <h3>Save</h3>
    <p class="hint">Progress is saved in this browser only. Copy the code to carry it to another device, or paste one here to load it.</p>
    <textarea id="scode" rows="3" aria-label="Save code" spellcheck="false" autocomplete="off"></textarea>
    <div class="srow"><button id="sexport" class="act">Copy save code</button><button id="simport" class="act">Load code</button></div>
    <h3>Photo</h3>
    <div class="srow"><span>Save a clean picture of your planet (or press P).</span><button id="sphoto" class="act">Take photo</button></div>
    <button id="snew" class="act">New game</button>
    <p class="hint">TERRAFORM · <a href="https://github.com/u7k4rs6/terraform-idle">source on GitHub</a> · <a href="privacy.html">privacy</a></p>
  </div>
</section>
<button id="cineskip" hidden>Skip &gt;&gt;</button>
<div id="warp" role="dialog" aria-modal="true" aria-labelledby="warph" hidden>
  <div class="box"><h2 id="warph">Planet terraformed</h2><p id="warptxt"></p><h3 id="boonh"></h3><div id="boons"></div><div class="srow"><button id="warpstay">Stay a while</button><button id="warpshare">Share</button></div></div>
</div>
<script src="data.js?v=9"></script>
<script src="game.js?v=9"></script>
</body>
</html>
